[project]
name = "mlops-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvclive>=3.49.1",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "pandas>=3.0.6",
    "pyyaml",
    "scikit-learn>=1.9.1",
    "wordcloud>=1.9.6",
    "xgboost>=3.4.1",
]

[project.scripts]
mlops-pipeline = "mlops_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
